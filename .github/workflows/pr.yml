name: Pull Requests

# Only pull requests trigger this workflow. A `push` trigger as well ran every PR commit twice (once per event).
# Pushes to development, main and releases are covered by the snapshot and release workflows.
on:
  pull_request:
    branches:
      - "releases/v*"
      - development

# A new commit on a PR cancels the run still in flight for the previous one
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Format PR
  format_check:
    name: Checks Source Code Formatting
    runs-on: ubuntu-20.04
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - uses: Ortus-Solutions/commandbox-action@v1.0.3
        with:
          cmd: run-script format:check

      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck
